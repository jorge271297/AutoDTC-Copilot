# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - AutoDTC-Copilot

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Prepare standalone deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy/.next
          cp -a .next/standalone/. deploy/
          cp -a .next/static deploy/.next/static
          if [ -d public ]; then cp -a public deploy/public; fi
          (cd deploy && zip -qr ../app.zip .)

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AF8FAC0AF18944E3A3677AD7A3FDAA11 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DF7CC7CB3BBF42639EF998370C120069 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CE5D4E9F493341A8BCB3EE495010018C }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AutoDTC-Copilot'
          slot-name: 'Production'
          package: app.zip

      - name: Configure App Service startup command
        run: |
          resource_group=$(az webapp list --query "[?name=='AutoDTC-Copilot'].resourceGroup | [0]" --output tsv)
          if [ -z "$resource_group" ]; then
            echo "No se encontró el grupo de recursos de AutoDTC-Copilot."
            exit 1
          fi
          az webapp config set \
            --resource-group "$resource_group" \
            --name AutoDTC-Copilot \
            --startup-file "node server.js"
          